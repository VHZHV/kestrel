---
version: v1.0
name: Build
agent:
  machine:
    type: e1-standard-2

auto_cancel:
  queued:
    when: "true"
fail_fast:
  stop:
    when: "true"

global_job_config:
  prologue:
    commands_file: commands/set_vars_and_checkout.sh

blocks:
  - name: Verify
    task:
      secrets:
        - name: artifacts
      jobs:
        - name: Maven
          commands:
            - cache clear
after_pipeline:
  task:
    jobs:
      - name: Publish Test Results
        commands:
          - test-results gen-pipeline-report

promotions:
  - name: Publish
    pipeline_file: publish.yaml
    auto_promote:
      when: result = 'passed' AND tag =~ '.+'
