---
version: v1.0
name: Pipeline
agent:
  machine:
    type: f1-standard-2

auto_cancel:
  queued:
    when: "true"
fail_fast:
  stop:
    when: "true"

global_job_config:
  prologue:
    commands_file: commands/set_vars_and_checkout.sh

blocks:
  - name: Test
    dependencies: [ ]
    task:
      jobs:
        - name: Maven
          commands:
            - wait
            - cd "${REPO_NAME}"

            - source ./.semaphore/scripts/setup_maven.sh
            - source ./.semaphore/scripts/service_account_login.sh 'semaphore@hozah-artifacts.iam.gserviceaccount.com'

            - ./mvnw --threads=1.5C verify
      epilogue:
        always:
          commands:
            - |-
              if [[ "$SEMAPHORE_JOB_NAME" = 'Maven' ]]; then
                (npx --yes junit-report-merger ./combined.xml $(find -name 'TEST-*.xml' -path '*/target/surefire-reports/*') && test-results publish ./combined.xml) &
                (cache delete "maven-${BRANCH_NAME}" && cache store "maven-${BRANCH_NAME}" ~/.m2) &
                if [[ "$BRANCH_NAME" = "${MAIN_BRANCH}" ]]; then (cache delete sdkman-java && cache store sdkman-java ~/.sdkman/candidates/java) & fi
              fi
              wait
after_pipeline:
  task:
    jobs:
      - name: Publish Test Results
        commands:
          - test-results gen-pipeline-report || true

promotions:
  - name: Publish
    pipeline_file: publish.yaml
    auto_promote:
      when: result = 'passed' AND tag =~ '.+'
