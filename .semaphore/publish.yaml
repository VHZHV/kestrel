---
version: v1.0
name: Publish
agent:
  machine:
    type: r1-standard-2

global_job_config:
  prologue:
    commands_file: commands/set_vars_and_checkout.sh

blocks:
  - name: Publishing
    dependencies: []
    task:
      agent:
        machine:
          type: f1-standard-2
      jobs:
        - name: Artifacts
          commands:
            - source ./.semaphore/scripts/setup_maven.sh
            - source ./.semaphore/scripts/service_account_login.sh 'semaphore@hozah-artifacts.iam.gserviceaccount.com'

            - version="${SEMAPHORE_GIT_TAG_NAME:-0.0.${SEMAPHORE_GIT_PR_NUMBER}-${SEMAPHORE_WORKFLOW_NUMBER}-SNAPSHOT}"
            - echo "Publishing version ${version}"
            - ./mvnw versions:set -DnewVersion="${version}"
            - ./mvnw deploy -DskipTests -pl kestrel-core,kestrel-http-event-streams,kestrel-inmemory-backend,kestrel-jdbc-backend,kestrel-json,kestrel-opentelemetry-metrics -am
